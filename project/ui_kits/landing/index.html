<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

<script type="text/babel">
  const { Button } = window.HolaSpanskDesignSystem_9649fd;
  function App() {
    const [theme, setTheme] = React.useState('light');
    React.useEffect(() => { document.documentElement.setAttribute('data-theme', theme); }, [theme]);
    const toggle = () => setTheme((t) => (t === 'light' ? 'dark' : 'light'));
    return (
      <React.Fragment>
        <Hero onTheme={toggle} theme={theme} />
        <Manifesto />
        <ImageReveal />
        <Pillars />
        <Palabras />
        <Terraza />
        <CTASection />
        <Footer />
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  // nav CTA via DS Button (mounted into the static nav)
  ReactDOM.createRoot(document.getElementById('navCta')).render(
    <Button as="a" href="#" variant="primary" size="sm" arrow>¿Vienes?</Button>
  );
</script>
