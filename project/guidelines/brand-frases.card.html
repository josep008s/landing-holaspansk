<!-- @dsCard group="Brand" viewport="700x230" name="Frases de marca" subtitle="The arc of metaphors & usable brand lines" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family: var(--font-sans); background: var(--surface-ink); padding:26px; color:#fff; }
  .arc { display:flex; gap:8px; align-items:center; font: var(--type-quote); font-size:22px; color: var(--hs-melocoton); }
  .arc span { opacity:.5; font-size:16px; }
  .lines { display:flex; flex-wrap:wrap; gap:8px; margin-top:20px; }
  .chip { font-size:13px; font-weight:500; padding:7px 14px; border-radius: var(--radius-pill); background: rgba(255,255,255,.08); color: rgba(255,255,255,.85); }
  .chip.hl { background: var(--hs-rojo); color:#fff; }
</style>
</head>
<body>
  <div class="arc">Ventana <span>→</span> Terraza <span>→</span> Sobremesa <span>→</span> Vecino</div>
  <div class="lines">
    <span class="chip hl">Bienvenido a la terraza</span>
    <span class="chip">Eso no se traduce</span>
    <span class="chip">Versión turista vs vecino</span>
    <span class="chip">Nos vemos en la terraza</span>
    <span class="chip">Poco a poco se anda lejos</span>
    <span class="chip">No vendemos cursos. Abrimos ventanas.</span>
  </div>
</body>
</html>
