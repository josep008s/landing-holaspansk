<!-- @dsCard group="Brand" viewport="700x260" name="Mundo pintado — imagery" subtitle="Original Sorolla-lineage oil. Frame → luminous opening. Shadow violet, never grey." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family: var(--font-sans); background: var(--surface-card); display:flex; gap:16px; padding:16px; }
  figure { margin:0; flex:1; }
  .frame { width:100%; aspect-ratio: 1/1; border-radius: var(--radius-lg); overflow:hidden; box-shadow: var(--shadow-frame); }
  .frame img { width:100%; height:100%; object-fit:cover; display:block; }
  figcaption { font: var(--type-caption); color: var(--text-secondary); margin-top:8px; }
  figcaption b { color: var(--text-primary); }
</style>
</head>
<body>
  <figure>
    <div class="frame"><img src="../assets/img/sorolla-pergola.jpg" alt="Pergola over the sea"></div>
    <figcaption><b>Mirar a través del marco</b> — vine frames a luminous sea</figcaption>
  </figure>
  <figure>
    <div class="frame"><img src="../assets/img/sorolla-sobremesa.jpg" alt="Table after the meal"></div>
    <figcaption><b>Sobremesa</b> — the table after, light moving slowly</figcaption>
  </figure>
</body>
</html>
