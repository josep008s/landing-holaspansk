<!-- @dsCard group="Colors" viewport="700x150" name="Neutro & texto" subtitle="Tinta, Lino, Arena — the calm canvas under the paint" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family: var(--font-sans); background: var(--surface-card); }
  .row { display:flex; gap:14px; padding:20px; }
  .sw { flex:1; }
  .chip { height:74px; border-radius: var(--radius-md); box-shadow: var(--shadow-soft); border:1px solid rgba(0,0,0,.06); }
  .name { font-size:12px; font-weight:600; color: var(--text-primary); margin-top:10px; }
  .hex { font-size:12px; color: var(--text-secondary); letter-spacing:.04em; margin-top:2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--hs-tinta)"></div><div class="name">Tinta</div><div class="hex">#1F2937</div></div>
    <div class="sw"><div class="chip" style="background:var(--hs-lino)"></div><div class="name">Lino</div><div class="hex">#F2EDE2</div></div>
    <div class="sw"><div class="chip" style="background:var(--hs-arena)"></div><div class="name">Arena</div><div class="hex">#F5F0E8</div></div>
    <div class="sw"><div class="chip" style="background:var(--hs-cal)"></div><div class="name">Cal al sol</div><div class="hex">#F6ECDC</div></div>
    <div class="sw"><div class="chip" style="background:var(--hs-blanco)"></div><div class="name">Blanco cálido</div><div class="hex">#FFFBF5</div></div>
  </div>
</body>
</html>
