<!-- @dsCard group="Colors" viewport="700x180" name="Regla de luz (innegociable)" subtitle="Sol cálido dorado + sombra SIEMPRE violeta-azul, nunca gris" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family: var(--font-sans); background: var(--surface-card); }
  .wrap { display:flex; gap:18px; padding:20px; align-items:stretch; }
  .luz { flex:1.3; border-radius: var(--radius-lg); background: var(--grad-luz); box-shadow: var(--shadow-soft); display:flex; align-items:flex-end; padding:14px; }
  .luz span { font:var(--type-quote); font-size:20px; color:#7c2d12; }
  .pair { flex:1; display:flex; flex-direction:column; gap:10px; }
  .yes, .no { flex:1; border-radius: var(--radius-md); display:flex; align-items:center; gap:10px; padding:0 14px; font-size:13px; font-weight:600; }
  .yes { background: linear-gradient(120deg,#FCD34D,#F59E0B); color:#7c2d12; }
  .yes::after { content:'sombra → violeta'; margin-left:auto; padding:4px 10px; border-radius:99px; background:var(--hs-sombra); color:#fff; font-size:11px; }
  .no { background:#E5E7EB; color:#6B7280; }
  .no::after { content:'sombra gris ✕'; margin-left:auto; padding:4px 10px; border-radius:99px; background:#9CA3AF; color:#fff; font-size:11px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="luz"><span>luz dorada</span></div>
    <div class="pair">
      <div class="yes">holaSpansk</div>
      <div class="no">no es holaSpansk</div>
    </div>
  </div>
</body>
</html>
