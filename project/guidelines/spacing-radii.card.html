<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="Soft md/lg for cards, xl for image frames, pill for CTAs" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family: var(--font-sans); background: var(--surface-card); padding:24px; }
  .row { display:flex; gap:18px; align-items:flex-end; }
  .box { width:78px; height:60px; background: var(--hs-cal); border:1.5px solid var(--hs-amarillo); }
  .lab { font-size:11px; color: var(--text-secondary); margin-top:8px; text-align:center; }
  .pill { width:120px; height:42px; border-radius:var(--radius-pill); background:var(--hs-rojo); }
</style>
</head>
<body>
  <div class="row">
    <div><div class="box" style="border-radius:var(--radius-sm)"></div><div class="lab">sm 8</div></div>
    <div><div class="box" style="border-radius:var(--radius-md)"></div><div class="lab">md 14</div></div>
    <div><div class="box" style="border-radius:var(--radius-lg)"></div><div class="lab">lg 20</div></div>
    <div><div class="box" style="border-radius:var(--radius-xl)"></div><div class="lab">xl 28</div></div>
    <div><div class="pill"></div><div class="lab">pill 100 (CTA)</div></div>
  </div>
</body>
</html>
