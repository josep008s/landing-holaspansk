<!-- @dsCard group="Colors" viewport="700x150" name="Núcleo — the loud trio" subtitle="Rojo, Amarillo, Azul — the instantly recognisable core" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family: var(--font-sans); background: var(--surface-card); }
  .row { display:flex; gap:14px; padding:20px; }
  .sw { flex:1; }
  .chip { height:74px; border-radius: var(--radius-md); box-shadow: var(--shadow-soft); }
  .name { font: var(--type-caption); font-weight:600; color: var(--text-primary); margin-top:10px; }
  .hex { font-size:12px; color: var(--text-secondary); letter-spacing:.04em; margin-top:2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--hs-rojo)"></div><div class="name">Rojo Pasión</div><div class="hex">#E11D48</div></div>
    <div class="sw"><div class="chip" style="background:var(--hs-amarillo)"></div><div class="name">Amarillo Sol</div><div class="hex">#F59E0B</div></div>
    <div class="sw"><div class="chip" style="background:var(--hs-azul)"></div><div class="name">Azul Mediterráneo</div><div class="hex">#0EA5E9</div></div>
    <div class="sw"><div class="chip" style="background:var(--hs-naranja)"></div><div class="name">Naranja</div><div class="hex">#EA580C</div></div>
  </div>
</body>
</html>
