<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family: var(--font-sans); background: var(--surface-ink); padding:28px; text-align:center; }
  .label { font: var(--type-overline); text-transform:uppercase; letter-spacing: var(--tracking-overline); color: rgba(255,255,255,.3); margin:0 0 14px; }
  .word { font: var(--type-palabra); font-size: clamp(56px,11vw,96px); font-style:italic; margin:0;
    background: var(--grad-luz); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
</style>
</head>
<body>
  <p class="label">Palabras con Alma</p>
  <p class="word">sobremesa</p>
</body>
</html>
