<!-- @dsCard group="Spacing" viewport="700x170" name="Shadows & elevation" subtitle="Warm, soft elevation — never a hard grey box" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family: var(--font-sans); background: var(--surface-page); padding:28px; }
  .row { display:flex; gap:26px; }
  .card { flex:1; height:78px; background: var(--surface-card); border-radius: var(--radius-lg); display:flex; align-items:center; justify-content:center; font-size:12px; color: var(--text-secondary); }
  .s1 { box-shadow: var(--shadow-soft); }
  .s2 { box-shadow: var(--shadow-raised); }
  .s3 { box-shadow: var(--shadow-cta); background: var(--hs-rojo); color:#fff; }
</style>
</head>
<body>
  <div class="row">
    <div class="card s1">soft</div>
    <div class="card s2">raised</div>
    <div class="card s3">cta glow</div>
  </div>
</body>
</html>
