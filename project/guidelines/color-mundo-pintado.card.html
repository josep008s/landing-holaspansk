<!-- @dsCard group="Colors" viewport="700x220" name="Mundo pintado — the oil-painting world" subtitle="Buganvilla (firma), grapevine violets, terracotta, sea greens" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family: var(--font-sans); background: var(--surface-card); }
  .grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; padding:20px; }
  .chip { height:56px; border-radius: var(--radius-md); box-shadow: var(--shadow-soft); }
  .name { font-size:12px; font-weight:600; color: var(--text-primary); margin-top:8px; }
  .hex { font-size:11px; color: var(--text-secondary); letter-spacing:.04em; margin-top:1px; }
  .firma { outline:2px solid var(--hs-buganvilla); outline-offset:2px; }
</style>
</head>
<body>
  <div class="grid">
    <div><div class="chip firma" style="background:var(--hs-buganvilla)"></div><div class="name">Buganvilla ★</div><div class="hex">#C42A6B</div></div>
    <div><div class="chip" style="background:var(--hs-violeta-parra)"></div><div class="name">Violeta parra</div><div class="hex">#8E3A86</div></div>
    <div><div class="chip" style="background:var(--hs-terracota)"></div><div class="name">Terracota</div><div class="hex">#C2703F</div></div>
    <div><div class="chip" style="background:var(--hs-melocoton)"></div><div class="name">Cielo melocotón</div><div class="hex">#F4A86E</div></div>
    <div><div class="chip" style="background:var(--hs-mar-profundo)"></div><div class="name">Mar profundo</div><div class="hex">#1B7E96</div></div>
    <div><div class="chip" style="background:var(--hs-verde-parra)"></div><div class="name">Verde parra</div><div class="hex">#5C8A4A</div></div>
    <div><div class="chip" style="background:var(--hs-cobalto)"></div><div class="name">Cobalto azulejo</div><div class="hex">#1E3A8A</div></div>
    <div><div class="chip" style="background:var(--hs-sombra)"></div><div class="name">Sombra violeta</div><div class="hex">#A7A6C8</div></div>
  </div>
</body>
</html>
