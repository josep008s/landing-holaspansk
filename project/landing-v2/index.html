<!DOCTYPE html>
<html lang="nb" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>holaSpansk — Kom nærmere Spania</title>
<link rel="stylesheet" href="../styles.css">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
  body {
    font-family: var(--font-sans); color: var(--text-primary); background: var(--surface-page);
    transition: background var(--dur-theme) var(--ease-out), color var(--dur-theme) var(--ease-out);
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }

  /* ---- Fixed nav ---- */
  nav.top {
    position: fixed; top:0; left:0; right:0; z-index:40;
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px clamp(20px,5vw,64px);
    backdrop-filter: var(--blur-glass); background: var(--nav-bg);
    border-bottom: 1px solid var(--border-form);
    transition: background var(--dur-theme) var(--ease-out), transform var(--dur-base) var(--ease-soft);
  }
  nav.top .brand { display:flex; align-items:center; gap:11px; }
  nav.top .brand img { width:38px; height:38px; border-radius:9px; box-shadow: var(--shadow-soft); display:block; }
  nav.top .brand .word { font-size:20px; font-weight:900; letter-spacing:-0.03em; }
  nav.top .brand .word .h { color: var(--hs-amarillo); }
  nav.top .brand .word .s { color: var(--hs-rojo); }
  nav.top .links { display:flex; align-items:center; gap: clamp(18px,2.4vw,38px); }
  nav.top .links .navlink { font-size:14px; font-weight:500; color: var(--text-secondary); transition: color var(--dur-fast) var(--ease-out); }
  nav.top .links .navlink:hover { color: var(--text-primary); }
  @media (max-width: 760px){ nav.top .links .navlink { display:none; } }

  .themebtn {
    height: 40px; padding: 0 16px; border-radius: 100px;
    border: 1.5px solid var(--border-form); background: transparent;
    cursor: pointer; font-family: var(--font-sans); font-weight:600; font-size:13px;
    color: var(--text-primary); display:flex; align-items:center; gap:8px;
    transition: border-color var(--dur-fast), background var(--dur-fast);
  }
  .themebtn:hover { border-color: var(--hs-amarillo); }

  /* ---- Scroll reveal ---- */
  [data-reveal] { opacity:0; transform: translateY(28px); transition: opacity .8s var(--ease-soft), transform .8s var(--ease-soft); }
  [data-reveal].in { opacity:1; transform:none; }
  [data-reveal-delay="1"] { transition-delay: .12s; }
  [data-reveal-delay="2"] { transition-delay: .24s; }
  [data-reveal-delay="3"] { transition-delay: .36s; }

  /* word-by-word manifesto */
  .word-rev { display:inline-block; opacity:0; transform: translateY(16px); transition: opacity .6s var(--ease-soft), transform .6s var(--ease-soft); }
  .word-rev.in { opacity:1; transform:none; }

  /* marquee */
  @keyframes hs-marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .marquee-track { display:flex; width:max-content; animation: hs-marquee 38s linear infinite; }
  .marquee:hover .marquee-track { animation-play-state: paused; }

  @media (prefers-reduced-motion: reduce){
    html { scroll-behavior:auto; }
    [data-reveal], .word-rev { opacity:1 !important; transform:none !important; transition:none !important; }
    .marquee-track { animation: none !important; }
  }
</style>
</head>
<body>
<nav class="top" id="nav">
  <a href="#top" class="brand">
    <img src="../assets/logo.png" alt="holaSpansk">
    <span class="word"><span class="h">hola</span><span class="s">Spansk</span></span>
  </a>
  <div class="links">
    <a href="#manifest" class="navlink">Manifest</a>
    <a href="#kultur" class="navlink">Hva du finner</a>
    <a href="#palabras" class="navlink">Palabras con alma</a>
    <button class="themebtn" id="themeBtn">☾ Nattmodus</button>
    <span id="navCta"></span>
  </div>
</nav>

<div id="top"></div>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<script type="text/babel" src="HeroV2.jsx"></script>
<script type="text/babel" src="Editorial.jsx"></script>
<script type="text/babel" src="Palabras.jsx"></script>
<script type="text/babel" src="Closing.jsx"></script>
<script type="text/babel">
  const { Button } = window.HolaSpanskDesignSystem_9649fd;
  const { Hero, Manifesto, FramedImage, Pillars, TuristaVecino, Palabras, Terraza, CTASection, Footer } = window.LV2;

  function App() {
    return (
      <React.Fragment>
        <Hero />
        <Manifesto />
        <FramedImage />
        <Pillars />
        <TuristaVecino />
        <Palabras />
        <Terraza />
        <CTASection />
        <Footer />
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  // nav CTA via DS Button
  ReactDOM.createRoot(document.getElementById('navCta')).render(
    <Button as="a" href="#vienes" variant="primary" size="sm" arrow>¿Vienes?</Button>
  );

  /* ---- Theme toggle ---- */
  const themeBtn = document.getElementById('themeBtn');
  themeBtn.addEventListener('click', () => {
    const root = document.documentElement;
    const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    root.setAttribute('data-theme', next);
    themeBtn.textContent = next === 'light' ? '☾ Nattmodus' : '☀ Dagmodus';
  });

  /* ---- Scroll reveal (rect-based — robust in any embed) ---- */
  let ticking = false;
  function reveal(el) {
    el.classList.add('in');
    // fallback: force the final state in case time-based transitions are throttled (offscreen embeds)
    const wait = el.classList.contains('word-rev') ? 1600 : 1100;
    setTimeout(() => { el.style.transition = 'none'; el.style.opacity = '1'; el.style.transform = 'none'; }, wait);
  }
  function checkReveal() {
    ticking = false;
    const vh = window.innerHeight;
    document.querySelectorAll('[data-reveal]:not(.in), .word-rev:not(.in)').forEach((el) => {
      const r = el.getBoundingClientRect();
      if (r.top < vh * 0.9 && r.bottom > 0) reveal(el);
    });
  }
  function requestCheck() { if (!ticking) { ticking = true; requestAnimationFrame(checkReveal); } }
  window.addEventListener('scroll', requestCheck, { passive: true });
  window.addEventListener('resize', requestCheck, { passive: true });
  const mo = new MutationObserver(requestCheck);
  mo.observe(document.getElementById('root'), { childList: true, subtree: true });
  [80, 300, 800].forEach((t) => setTimeout(checkReveal, t));
  // safety net: never leave anything permanently hidden
  setTimeout(() => document.querySelectorAll('[data-reveal]:not(.in), .word-rev:not(.in)').forEach(reveal), 4000);

  /* ---- Hide nav on scroll down, show on up ---- */
  let lastY = 0;
  const nav = document.getElementById('nav');
  window.addEventListener('scroll', () => {
    const y = window.scrollY;
    if (y > 120 && y > lastY) nav.style.transform = 'translateY(-110%)';
    else nav.style.transform = 'translateY(0)';
    lastY = y;
  }, { passive: true });
</script>
</body>
</html>
